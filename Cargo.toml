[package]
name = "broccoli-devops-agent"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "broccoli_devops_agent"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4.43", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "sync"] }
uuid = { version = "1", features = ["serde", "v7"] }

