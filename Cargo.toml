[package]
name = "broccoli-devops-agent"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "broccoli_devops_agent"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4.43", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
toml = "0.8"
uuid = { version = "1", features = ["serde", "v7"] }

[dev-dependencies]
tempfile = "3"

