[workspace]
members = ["crates/harness", "crates/tui"]
resolver = "3"

[package]
name = "broccoli-devops-agent"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "broccoli_devops_agent"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1.89"
axum = "0.8"
base64 = "0.22"
broccoli-agent-harness = { path = "crates/harness", features = ["openai"] }
chrono = { version = "0.4.43", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
# preserve_order and float_roundtrip: a JSON body read back and re-serialized reproduces its
# bytes exactly (key order kept, floats parsed to the same f64 they were printed from), which is
# what lets a session file carry artifact bodies as readable JSON and still verify their hashes.
serde_json = { version = "1.0.149", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
toml = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["serde", "v7"] }

[dev-dependencies]
tempfile = "3"

