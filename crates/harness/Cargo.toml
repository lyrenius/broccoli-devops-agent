[package]
name = "broccoli-agent-harness"
version = "0.1.0"
edition = "2024"
publish = false
description = "Model-agnostic agentic loop: typed tools, bounded turns, replayable transcripts"

[features]
default = []
# OpenAI-compatible HTTP backend (Responses or Chat Completions wire format).
openai = ["dep:reqwest"]

[dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4.43", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["macros", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
