[package]
name = "broccoli-tui"
version = "0.1.0"
edition = "2024"
publish = false
description = "Terminal operator console for the Broccoli DevOps Agent, a pure client of its HTTP API"

[[bin]]
name = "broccoli-tui"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "time"] }
