# Deployment topology for the Broccoli DevOps Agent.
#
# Copy this file to config/topology.toml and adjust hosts and ports for your deployment.
# Endpoints below match the Broccoli development docker-compose (postgres on 5433, redis on
# 6379) and the server default of 127.0.0.1:3000. Storage is modelled as CephFS: probe the Ceph
# monitor (msgr2 on 3300, or 6789 for msgr1) and the RGW/S3 gateway if Broccoli's object storage
# goes through it. For the SeaweedFS docker-compose instead, probe 9333 (master) and 8333 (S3).
#
# Probes are read-only reachability checks from the v0.1 Probe Registry:
#   tcp.connect  — { probe = "tcp.connect", target = "host:port" }
#   http.status  — { probe = "http.status", url = "http://host:port/path" }   (plain HTTP only)
# A resource without probes appears as Unknown with an explicit coverage gap.
#
# This file must never contain credentials.

[deployment]
id = "0198c936-5f2a-7000-8000-4a6f8c2d91aa"
name = "broccoli-dev"
topology_revision = "dev-compose-1"
operation_mode = "rehearsal"

[[resources]]
id = "postgres-main"
kind = "postgresql"
node = "infra-1"
probes = [{ probe = "tcp.connect", target = "127.0.0.1:5433" }]

[[resources]]
id = "redis-mq"
kind = "redis"
node = "infra-1"
probes = [{ probe = "tcp.connect", target = "127.0.0.1:6379" }]

[[resources]]
id = "cephfs-storage"
kind = "object_storage"
node = "storage-1"
probes = [
    { probe = "tcp.connect", target = "127.0.0.1:3300" },   # ceph-mon (msgr2)
    { probe = "tcp.connect", target = "127.0.0.1:8333" },   # RGW / S3 gateway used by Broccoli
]

[[resources]]
id = "broccoli-server"
kind = "broccoli_server"
node = "app-1"
probes = [{ probe = "http.status", url = "http://127.0.0.1:3000/healthz" }]

[[resources]]
id = "web-frontend"
kind = "frontend"
node = "app-1"
probes = [{ probe = "tcp.connect", target = "127.0.0.1:5173" }]

# Judge workers are Linux-only; from a dev laptop they are typically unreachable and will show
# as coverage gaps until worker probes are configured for the contest network.
[[resources]]
id = "worker-1"
kind = "worker"
node = "judge-1"

[[resources]]
id = "printer-station-1"
kind = "printer_station"
node = "stations-1"

[[dependencies]]
from = "broccoli-server"
to = "postgres-main"
relation = "sql"
critical = true

[[dependencies]]
from = "broccoli-server"
to = "redis-mq"
relation = "redis_mq"
critical = true

[[dependencies]]
from = "broccoli-server"
to = "cephfs-storage"
relation = "s3_blob"
critical = true

[[dependencies]]
from = "web-frontend"
to = "broccoli-server"
relation = "rest_api"
critical = true

[[dependencies]]
from = "worker-1"
to = "redis-mq"
relation = "redis_mq"
critical = true

[[dependencies]]
from = "printer-station-1"
to = "broccoli-server"
relation = "rest_api"
critical = false

# ---------------------------------------------------------------------------------------------
# Business probes (all unauthenticated reads; credentials never belong in this file):
#
# [[resources]]
# id = "redis-mq"
# kind = "redis"
# probes = [
#   { probe = "tcp.connect", target = "10.0.0.11:6379", degraded_above_ms = 50 },
#   # queue backlog: Degraded above 200 pending entries, published as the metric `queue.depth`
#   { probe = "redis.llen", target = "10.0.0.11:6379", key = "judge:queue", metric = "queue.depth", max = 200 },
# ]
#
# [[resources]]
# id = "broccoli-server"
# kind = "broccoli_server"
# probes = [
#   { probe = "http.status", url = "http://10.0.0.12:3000/healthz", degraded_above_ms = 300 },
#   # any counter an unauthenticated JSON endpoint exposes, one value per probe
#   { probe = "http.json", url = "http://10.0.0.12:3000/api/v1/health", pointer = "/status", expect = "ok" },
# ]
#
# Broccoli's admin API (worker heartbeats, MQ queue depths) needs a login with system:view.
# The probes read `username:password` from the BROCCOLI_PROBE_LOGIN environment variable
# (or the variable named by `login_env`), never from this file:
#
# [[resources]]
# id = "worker-1"
# kind = "worker"
# probes = [{ probe = "broccoli.worker", url = "http://10.0.0.12:3000" }]   # worker_id defaults to the resource id
#
# [[resources]]
# id = "redis-mq"
# kind = "redis"
# probes = [
#   { probe = "tcp.connect", target = "10.0.0.11:6379" },
#   { probe = "broccoli.queue", url = "http://10.0.0.12:3000", queue = "operation_tasks", metric = "queue.depth", max = 200 },
# ]
