# Broccoli DevOps Agent configuration.
#
# Copy to config/agent.toml. This file may be committed and shown to a frontend: it never holds
# credentials. The model API key is read from the environment variable named in `api_key_env`.

[agent]
language = "en"                       # "en" or "zh-CN": the language everything the agent writes
                                      # (diagnoses, denial reasons, event log, model output).
                                      # Fixed for the life of the process; the consoles switch
                                      # their own language at runtime.
max_auto_passes = 3                   # passes per report or send-back: observe, act, check; 1 = one pass, then a human

[data]
dir = "data"                          # file-backed store, event log, artifact bodies

[topology]
path = "config/topology.toml"         # machines, endpoints, and probes (PostgreSQL, Redis, CephFS, ...)

[model]
base_url = "https://api.thuics.icu/v1"  # GPT relay (sub2api); adjust the prefix if the relay differs
model = "gpt-5.6-sol"
api_key_env = "BROCCOLI_MODEL_API_KEY"  # export BROCCOLI_MODEL_API_KEY=... before running
wire_api = "responses"                  # "responses" (default) or "chat" if the relay lacks /responses
timeout_secs = 120
max_model_turns = 8                     # per agent run
max_tool_calls = 16                     # per agent run, refused calls included
max_inspections = 6                     # read-only runbook inspections the model may run per pass
max_tokens_per_run = 0                  # per agent run, input + output as the relay reports them;
                                        # 0 = no token limit (turns and tool calls still bound a run)

# What the relay charges, per million tokens. The rates below are PLACEHOLDERS — replace them
# with your relay's real ones, or delete the section. Without it tokens are still counted and
# a token budget still works; only the money cannot be shown, so every cost reads as absent
# rather than as zero. Cached input is a subset of input, billed once at its own rate.
[model.pricing]
input_per_mtok = 3.0
cached_input_per_mtok = 0.3
output_per_mtok = 15.0
currency = "USD"

# Cumulative spend ceiling across everything in the data directory. Reaching either figure
# freezes the Scheduler (the same full freeze recovery restores across restarts) and refuses new
# reports until it is raised and a human resumes. 0 = no ceiling. A cost ceiling needs
# [model.pricing]; a token ceiling does not.
[budget]
max_total_tokens = 0
max_total_cost = 0.0

[api]
bind = "127.0.0.1:4720"                 # the web console and TUI talk to this address
token = ""                              # optional bearer token; set one before binding beyond localhost

[platform]
dry_run = true                          # render and record commands without executing them
command_timeout_secs = 60
auto_repeat_window_secs = 600           # a repeated automatic action on the same target inside
                                        # this window escalates to human approval (matrix rule 5)

[platform.classification]               # rows 9–12 of docs/action-authority.md
tunable_config_keys = ["worker.concurrency", "server.request_timeout_secs", "database.pool_size"]
contest_config_keys = ["contest.freeze_at", "contest.end_at", "submission.time_limit_scale"]
security_config_keys = ["auth.secret", "server.cors.allow_origins"]
known_internal_address_prefixes = ["10.0.", "192.168."]

# Runbook commands: how each registered runbook executes on YOUR deployment. `{target}` is the
# resource ID from the topology; `{arg:name}` substitutes a proposal argument. Credentials stay
# with the machine's SSH agent — never in this file. A runbook without a command is refused.
# Non-mutating runbooks (rows 1 and 17) double as inspections: a model-backed Team may run
# them directly, within its Job's scope, to look before it proposes.
[[platform.runbooks]]
id = "service.status"
command = "echo status {target}"

[[platform.runbooks]]
id = "log.tail"
command = "echo would-run: ssh {target} journalctl -u broccoli-worker -n 100 --no-pager"

[[platform.runbooks]]
id = "worker.restart"
command = "echo would-run: ssh {target} sudo systemctl restart broccoli-worker"

[[platform.runbooks]]
id = "server.restart"
command = "echo would-run: ssh {target} sudo systemctl restart broccoli-server"

[[platform.runbooks]]
id = "station.restart"
command = "echo would-run: ssh {target} sudo systemctl restart broccoli-station"
